name: Mobile Builds

on:
  workflow_dispatch:
    inputs:
      build:
        description: O que gerar
        required: true
        default: all
        type: choice
        options:
          - all
          - capacitor-android
          - expo-android

permissions:
  contents: read

jobs:
  capacitor-android:
    if: ${{ inputs.build == 'all' || inputs.build == 'capacitor-android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Generate Capacitor Android project
        env:
          CAPACITOR_SERVER_URL: https://nivostudy-dnmtfe3-cpus-projects.vercel.app
        run: |
          rm -rf android
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Capacitor APK
        uses: actions/upload-artifact@v4
        with:
          name: NivoStudy-Capacitor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  expo-android:
    if: ${{ inputs.build == 'all' || inputs.build == 'expo-android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Expo app
        run: pnpm install --no-frozen-lockfile

      - name: Generate Expo native Android project
        env:
          EXPO_PUBLIC_NIVOSTUDY_URL: https://nivostudy-dnmtfe3-cpus-projects.vercel.app
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build Expo APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Expo APK
        uses: actions/upload-artifact@v4
        with:
          name: NivoStudy-Expo-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
