name: Build NivoStudy Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'public/nivostudy-logo.png'
      - '.github/workflows/build-nivostudy-apk.yml'

permissions:
  contents: read

concurrency:
  group: nivostudy-native-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Generate native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_DOCTOR: '1'

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native dependencies
        run: npm install --no-audit --no-fund

      - name: Verify native toolchain
        run: |
          node --version
          npx expo --version
          npm ls expo react-native --depth=0

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build native APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        working-directory: mobile
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/NivoStudy.apk
          test -s dist/NivoStudy.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: NivoStudy-Native-APK-${{ github.run_number }}
          path: mobile/dist/NivoStudy.apk
          if-no-files-found: error
          retention-days: 30
