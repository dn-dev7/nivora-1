name: Build NivoStudy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'native-web/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-nivostudy-apk.yml'

permissions:
  contents: read

concurrency:
  group: nivostudy-capacitor-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Generate NivoStudy APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Capacitor Android project
        env:
          CAPACITOR_SERVER_URL: https://nivostudy-dnmtfe3-cpus-projects.vercel.app
        run: |
          rm -rf android
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/NivoStudy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NivoStudy-APK-${{ github.run_number }}
          path: dist/NivoStudy.apk
          if-no-files-found: error
          retention-days: 30
