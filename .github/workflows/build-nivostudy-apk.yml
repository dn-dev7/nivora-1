name: Build NivoStudy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-nivostudy-apk.yml'

permissions:
  contents: read

concurrency:
  group: nivostudy-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check Expo project
        run: pnpm exec expo-doctor || true

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/NivoStudy.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NivoStudy-APK-${{ github.run_number }}
          path: mobile/dist/NivoStudy.apk
          if-no-files-found: error
          retention-days: 30
