name: Expo EAS Cloud Build

on:
  workflow_dispatch:
    inputs:
      expo_account:
        description: Nome da sua conta Expo
        required: true
        type: string
      platform:
        description: Plataforma
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: Perfil de build
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_NIVOSTUDY_URL: https://nivostudy-dnmtfe3-cpus-projects.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Adicione o secret EXPO_TOKEN no repositório antes de usar este workflow."
            exit 1
          fi

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Create or link Expo project
        run: npx eas-cli@latest init --account "${{ inputs.expo_account }}" --non-interactive

      - name: Start EAS build
        run: npx eas-cli@latest build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
