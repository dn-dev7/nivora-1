name: Build NivoStudy Standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'public/nivostudy-logo.png'
      - '.github/workflows/build-nivostudy-apk.yml'

permissions:
  contents: read

concurrency:
  group: nivostudy-native-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Generate standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_DOCTOR: '1'
      NODE_ENV: production

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native dependencies
        run: npm install --no-audit --no-fund

      - name: Verify native toolchain
        run: |
          node --version
          npx expo --version
          npm ls expo react-native --depth=0

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK and bundle JavaScript
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify bundled JavaScript and prepare APK
        working-directory: mobile
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/NivoStudy-Standalone.apk
          test -s dist/NivoStudy-Standalone.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: NivoStudy-Standalone-APK-${{ github.run_number }}
          path: mobile/dist/NivoStudy-Standalone.apk
          if-no-files-found: error
          retention-days: 30
